<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    侧边栏是本地静态页，经 WebView2 虚拟主机映射加载。
    connect-src 设为 none：面板不发起任何网络请求，
    所有接口调用都由加载项侧完成，密钥不进入这个页面。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'" />
  <title>Office-helper</title>
  <link rel="stylesheet" href="styles/app.css" />
  <!--
    主题脚本必须在这里同步加载，且排在页面内容之前。
    它把 data-theme 写到 <html> 上，样式表的深色变量块靠这个属性生效。
    放到页尾或交给 app.js（模块会延迟执行）都晚于首屏绘制——
    深色下开面板会先闪一下白底再变深。
  -->
  <script src="scripts/theme.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-bar">
      <span class="app-title">Office-helper</span>
        <span class="app-version" id="app-version" data-version="0.10.3.16">0.10.3.16</span>
      <span class="app-channel" id="app-channel" aria-label="当前渠道" hidden></span>
      <!--
        页签只留图标，文字收进悬停说明。图标一眼能认（气泡=对话、齿轮=设置），
        文字标签在窄栏里只是把标题挤掉。没有文字就必须有 title：悬停说明是
        它们唯一的自解释途径，aria-label 同时供读屏。

        当前页签仅靠底色与描边不够——纯图标少了字重这条线索，所以图标
        本身也换成强调色。

        诊断没有页签：它是出问题时才去一次的地方，不该常驻在每天都看的
        栏上占一格。入口在设置页「排查」区的「打开诊断」按钮，功能区的
        「诊断」按钮也到同一个页，路由与视图都还在。
      -->
      <nav class="app-nav">
        <button type="button" class="nav-btn is-active" data-route="chat"
                title="对话" aria-label="对话">
          <svg class="glyph-24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" />
          </svg>
        </button>
        <button type="button" class="nav-btn" data-route="settings"
                title="设置" aria-label="设置">
          <svg class="glyph-24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>

        <button type="button" class="nav-btn" data-route="proxy"
                title="代理" aria-label="代理">
          <svg class="glyph-24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
            <circle cx="16" cy="7" r="2" />
            <circle cx="8" cy="17" r="2" />
          </svg>
        </button>

        <!--
          主题切换。放在设置与代理之后：它改的是外观偏好，与「设置」同属一类，
          但比设置页里的任何一项都常用，值得占一个常驻位置。

          没有 data-route——它不是页签，点了不换页。app.js 的路由绑定按
          [data-route] 筛选，所以这个按钮不会被当成页签。

          两个图标都在 DOM 里，由 CSS 按 data-theme 显示其中一个：
          显示的是「点了会变成什么」（浅色下给月亮），title 也照目标写，
          图标与说明指向同一件事。title 与 aria-label 的初值由 theme.js
          在 DOM 就绪后按当前主题填，这里给的是浅色下的默认说法。
        -->
        <button type="button" class="nav-btn" id="theme-toggle"
                title="切换到深色主题" aria-label="切换到深色主题">
          <svg class="glyph-24 theme-glyph-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9" />
          </svg>
          <svg class="glyph-24 theme-glyph-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        </button>
      </nav>
    </header>
    <main class="app-body">
      <section class="view is-active" data-view="chat">
        <div class="chat">
          <div class="chat-transcript" id="transcript"></div>

          <!--
            底部信息行：左边是短暂状态，中间是排队条，右边是本轮用量。

            排队条放在这里而不是对话流里：排队的内容还没发生，混在已发生的
            消息之间会被当成已经处理过，而且对话一长就被顶出可视区——用户
            正想确认「我刚排的那条还在不在」，却要往上翻。贴着输入区显示则
            始终在眼前，与「待办」这个含义相符。
          -->
          <div class="chat-meta">
            <span class="status" id="status"></span>
            <div class="queue-strip" id="queue-strip" hidden
                 role="list" aria-label="排队中的输入"></div>
            <span class="usage" id="usage"></span>
          </div>

          <div class="chat-input">
            <!-- 附件区，图片缩略图与文件条同处一行。有附件时才显示。 -->
            <div class="attachments" id="attachments" hidden></div>

            <!-- 处理中不禁用：此时输入的内容进队列，上一轮结束后自动接着跑。 -->
            <textarea id="composer" rows="2"
                      placeholder="告诉我你想完成什么… Enter 发送，Shift+Enter 换行。支持图片和文本附件。"></textarea>

            <!--
              操作栏。所有控件与按钮排成一行，顺序按「想什么 → 会话动作 →
              怎么执行 → 发送」：
                [模型·思考] [清] [适配] …… [审批] [上下文] [发送]
              合并成一行是为了把省下的竖向空间让给输入框——窄栏里输入框的
              可视行数比按钮的横向余量更值钱。整行带底色与描边，
              和输入框在视觉上分开，不至于看成输入框的一部分。

              除模型选择器外全部收成 26px 见方的图标：文字按钮在窄栏里会把
              这一行挤到换行，而换行吃掉的是输入框的高度。图标没有文字标签，
              所以每一个都必须带 title——悬停说明是它们唯一的自解释途径。
            -->
            <div class="chat-controls">
              <!--
                模型与思考等级合成一个选择器，浮层里上下两段：上段模型、
                下段思考等级。二者强相关（不同模型支持的档位不同），放在一处
                切换比两个独立下拉更顺手。

                上下分段而不是左右分栏：面板常见宽度 320-420px，浮层去掉边框
                只剩三百来像素，按 62/38 分栏时模型段不到两百像素——网关的模型
                ID 动辄四五十字符，每一行都要折成两三行；而档位段一百出头，
                「Minimal」加一个降级标注就已经放不下。上下分段让两段都拿到
                整个浮层的宽度，各自一行一项。代价是浮层变高，因此浮层限了
                总高，模型段可滚动。
              -->
              <div class="picker" id="model-picker">
                <button type="button" class="picker-trigger" id="picker-trigger"
                        aria-haspopup="true" aria-expanded="false">
                  <span class="picker-model" id="picker-model">未选择模型</span>
                  <span class="picker-sep">·</span>
                  <!-- 初始值留空，由脚本按当前设置填入档位名（Off/High/Max
                       这类英文原名，与协议参数取值一致）。 -->
                  <span class="picker-thinking" id="picker-thinking"></span>
                </button>

                <div class="picker-pop" id="picker-pop" hidden>
                  <div class="picker-col picker-col-models">
                    <div class="picker-col-head">
                      <span>模型</span>
                      <!--
                        「只看名单」默认关，老用户升级后这一列逐字不变。开着而名单里
                        没有一个模型出现在目录里时会自动显示完整目录——开关不该把人
                        锁在外面。
                      -->
                      <!--
                        批量测试整份目录。放在「名单」之前：它的作用范围最大，
                        代价也最大——每个模型一条计费请求，目录有几十个 ID 就是几十次。
                        按钮上写出条数，让用户点之前就知道；并发 5，因此比串行快得多，
                        但也更容易撞上限流（限流判「未确认」，等于花了钱没拿到答案）。
                      -->
                      <button type="button" class="picker-test-all" id="picker-test-all"
                              aria-haspopup="true" aria-expanded="false"
                              aria-controls="picker-test-menu">测试</button>
                      <button type="button" class="picker-only-favorites" id="picker-only-favorites"
                              aria-pressed="false">名单</button>
                      <!--
                        逐个确认名单里的模型。只对名单提供，不对完整目录——
                        几十个 ID 就是几十次付费请求，而那正是要避开的开销。
                        跑起来后这个按钮变成「停止」，它只停批量，不碰对话。
                      -->
                      <button type="button" class="picker-probe-all" id="picker-probe-all"
                              disabled>全部确认</button>
                      <button type="button" class="picker-refresh" id="picker-refresh"
                              title="重新获取模型列表">刷新</button>
                    </div>
                    <!--
                      「测试」的范围菜单。点「测试」先在这里给出三档，选中一档才发请求。

                      为什么在流内插一行，而不是绝对定位浮在列表上：外层 .picker-pop 是
                      overflow: hidden 且向上弹出，绝对定位的浮层一旦超出它就被静默裁掉，
                      连滚动条都不留——被裁掉的那一档在界面上没有任何迹象说明它存在。
                      在流内插一行则由模型列表让出高度（它本来就可滚、且有 80px 下限），
                      装不下时菜单自己滚，三档都还点得到。

                      代价是菜单打开时列表往下移一段。可以接受：菜单只在点了「测试」之后
                      短暂存在，而它正是此刻要读的东西。
                    -->
                    <div class="picker-test-menu" id="picker-test-menu" role="group"
                         aria-label="测试范围" hidden></div>
                    <!--
                      上一次运行是怎么结束的。三种结局各有各的说法，尤其
                      「目标没达成而整份目录都测完了」——那时用户选了省钱的选项却付了
                      全额，不说出来界面上看不出这件事。

                      与菜单同为列表的兄弟节点，不放列表内部：放进去会随列表滚走，
                      而 renderModels 的两条提前 return 会让它永远追加不上。
                    -->
                    <div class="picker-test-note" id="picker-test-note" role="status" hidden></div>
                    <div class="picker-list" id="picker-models"></div>

                    <!--
                      手填模型 ID。不少网关不提供 GET /models，但只要给出正确的
                      模型 ID 就能正常调用，此时列表为空并不代表不可用。
                      入口放在选择器里而不是只留在设置页：模型是对话中会随时
                      切换的东西，为填一个 ID 跳去设置页再跳回来太绕。
                    -->
                    <form class="picker-manual" id="picker-manual">
                      <input type="text" class="picker-manual-input" id="picker-manual-input"
                             placeholder="直接填模型 ID" aria-label="手动填写模型 ID"
                             autocomplete="off" spellcheck="false" />
                      <button type="submit" class="picker-manual-apply"
                              title="使用这个模型 ID">使用</button>
                    </form>
                  </div>
                  <!--
                    思考等级。一行一档，说明文字收进悬停提示：七档说明摊开就是
                    七行小字，而在这一列里要做的只是挑一档，挑的时候看的是档位名。
                    会降级的档位仍在行上留一个短标——那不是解释，是「选了不生效」，
                    必须先看见才能选对。
                  -->
                  <div class="picker-col picker-col-thinking">
                    <!--
                      列头只留「思考等级」四个字。此前还挂了一句「悬停看说明」，
                      而这一列的宽度按内容取（max-content），那句小字比最长的档位名
                      还宽，于是它一个人把整列撑宽六十来像素——右侧一片空白，
                      挤掉的正是模型 ID 的横向空间。悬停能看到说明这件事，
                      鼠标划过一次就知道了，不值得常驻占宽。
                    -->
                    <div class="picker-col-head"><span>思考等级</span></div>
                    <div class="picker-list picker-list-thinking" id="picker-thinkings"></div>
                  </div>
                </div>
              </div>

              <!--
                新会话仍用扫帚表示「清掉」，图形换成成套图标里的同一metaphor
                版本：原先那把是手描的，笔画粗细与斜度都和这一行其它图标
                对不上。附件不再有专门的添加按钮：粘贴与拖入本就是主要入口，
                一个只为兜底存在的按钮不值得占这一行的横向空间。
              -->
              <button type="button" class="icon-btn" id="reset"
                      title="清空当前会话，重新开始" aria-label="清空当前会话">
                <svg class="glyph-24" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m16 22-1-4" />
                  <path d="M19 14a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2h-3a1 1 0 0 1-1-1V4a2 2 0 0 0-4 0v5a1 1 0 0 1-1 1H6a2 2 0 0 0-2 2v1a1 1 0 0 0 1 1" />
                  <path d="M19 14H5l-1.973 6.767A1 1 0 0 0 4 22h16a1 1 0 0 0 .973-1.233z" />
                  <path d="m8 22 1-4" />
                </svg>
              </button>

              <!--
                适配：对当前表的已用范围一次做完对齐与行列自适应。
                不必先选区——按钮的意思就是「把这页排好」。
                不经过模型：确定性的排版动作，点按钮已经表达了意图，
                再让模型转述一遍只会多等一轮并可能被误解。

                点图标就按当前对齐直接适配，不用先在浮层里选一项。
                默认居中，选过一次就记住，连续排版时最常见的情形是同一种对齐
                用好几次——每次都要多点一下浮层等于把默认值作废了。
                浮层因此只负责「换成哪一种」：鼠标悬停展开，键盘按上下方向键展开。
                垂直方向固定居中，不给选项——行变高后文字贴顶是要解决的问题
                本身，居中是唯一合理答案。

                按钮本身仍是「向四角撑开」的图标，只是四个角改用带圆角的
                成套画法，与新会话、页签共用同一套笔形。三个选项横排。横排而非竖排的
                理由：三项是同一维度上的方向选择，横向排布的图标顺序本身就
                对应左中右，比竖排更快读懂，浮层也更矮，不至于盖住对话。
                当前项以高亮标出，因此不再给「居中」贴「默认」标签——
                两套标记同时存在时反而要多想一步哪个才是现在生效的。
              -->
              <div class="fit" id="fit-wrap">
<!-- title 与 aria-label 里的对齐名由脚本按当前选择改写，
                     这里写的是默认值（居中）。 -->
                <button type="button" class="icon-btn" id="fit"
                        aria-haspopup="true" aria-expanded="false"
                        title="适配当前表（居中）：水平居中、垂直居中，列宽上限 100 并自动换行后调整行高。上下方向键可换对齐方式"
                        aria-label="适配当前表，当前对齐：居中">
                  <svg class="glyph-24" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3" />
                    <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
                    <path d="M3 16v3a2 2 0 0 0 2 2h3" />
                    <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
                  </svg>
                </button>

                <div class="fit-pop" id="fit-pop" hidden role="menu" aria-label="水平对齐方式">
                  <div class="fit-pop-head">换水平对齐并适配</div>
                  <div class="fit-pop-row">
                    <button type="button" class="fit-item" role="menuitem" data-align="left"
                            title="靠左对齐并适配行高列宽">
                      <span class="fit-item-glyph" aria-hidden="true">
                        <svg viewBox="0 0 16 16"><path d="M2 3h12M2 6.5h7M2 10h12M2 13.5h7" /></svg>
                      </span>
                      <span class="fit-item-name">靠左</span>
                    </button>
                    <button type="button" class="fit-item" role="menuitem" data-align="center"
                            title="居中对齐并适配行高列宽">
                      <span class="fit-item-glyph" aria-hidden="true">
                        <svg viewBox="0 0 16 16"><path d="M2 3h12M4.5 6.5h7M2 10h12M4.5 13.5h7" /></svg>
                      </span>
                      <span class="fit-item-name">居中</span>
                    </button>
                    <button type="button" class="fit-item" role="menuitem" data-align="right"
                            title="靠右对齐并适配行高列宽">
                      <span class="fit-item-glyph" aria-hidden="true">
                        <svg viewBox="0 0 16 16"><path d="M2 3h12M7 6.5h7M2 10h12M7 13.5h7" /></svg>
                      </span>
                      <span class="fit-item-name">靠右</span>
                    </button>
                  </div>
                </div>
              </div>

              <!--
                处理方式用图标表示：三种策略的差别是「问不问」与「问几次」，
                用盾牌的填充程度表达比文字更省空间也更直观。
                点击循环切换，图标与颜色同时变化。
              -->
              <!-- 右组：审批方式、上下文占用与发送，靠右对齐。 -->
              <div class="controls-right">
                <!-- title 先给个兜底值：真正的策略说明要等设置返回才填，
                     在那之前悬停也该有话可说。 -->
                <button type="button" class="approval-icon" id="approval-icon"
                        title="处理方式，点击切换" aria-label="处理方式">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path id="approval-glyph" d="" />
                  </svg>
                </button>
                <!-- 授权芯片本身就是收回入口：只显示不给收回，用户中途改主意时
                     唯一出路会变成掐掉整轮，而他想停的只是「别再自动放行」。 -->
                <button type="button" class="approval-grants" id="approval-grants" hidden
                        aria-live="polite"></button>

                <button type="button" class="context-ring" id="context-ring"
                        title="上下文占用" aria-label="上下文占用">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle class="ring-track" cx="12" cy="12" r="9" />
                    <circle class="ring-value" id="ring-value" cx="12" cy="12" r="9" />
                  </svg>
                  <span class="context-ring-text" id="context-percent">0</span>
                </button>

                <!--
                  发送与停止是同一个按钮的两种状态，不再各占一个位置。
                  三层图形按状态显示其中一层：

                    空闲   ↑        点击发送
                    工作中 旋转圆环  正在处理，圆环转动说明还活着
                    工作中+悬停 ■   点击停止

                  合成一个的理由：同一时刻只有一个动作有意义，并排放会让另一个
                  长期处于禁用态；而运行中把圆环换成方块，也让「停止」这个动作
                  出现在鼠标已经在的位置上，不必移到别处去找。
                -->
                <button type="button" class="icon-btn icon-btn-primary" id="send"
                        title="发送（Enter）" aria-label="发送">
                  <svg class="send-arrow" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 13V3.6M8 3.2l4 4M8 3.2l-4 4" />
                  </svg>

                  <!-- 多层圆环各转一圈：半径与速度都不同，叠起来是持续变化的
                       图形，比单环更能说明「还在动」。 -->
                  <svg class="send-spinner" viewBox="0 0 16 16" aria-hidden="true">
                    <circle class="send-ring send-ring-1" cx="8" cy="8" r="6" />
                    <circle class="send-ring send-ring-2" cx="8" cy="8" r="4" />
                    <circle class="send-ring send-ring-3" cx="8" cy="8" r="2" />
                  </svg>

                  <svg class="send-stop" viewBox="0 0 16 16" aria-hidden="true">
                    <rect x="4.5" y="4.5" width="7" height="7" rx="1.2" />
                  </svg>

                  <!-- 队列里还有待发内容时显示叉：此时按钮先清队列、不动正在跑的
                       那一轮，与排队条上每条的「×」是同一个意思，两处形状一致。
                       画方块会让人以为这一下就把当前任务掐了。 -->
                  <svg class="send-clear" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M5 5l6 6M11 5l-6 6" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="view" data-view="settings">
        <div class="settings">
          <div class="status" id="settings-status"></div>
          <div id="settings-form"></div>
        </div>
      </section>

      <section class="view" data-view="proxy">
        <div class="settings">
          <div class="status" id="proxy-status"></div>
          <div id="proxy-form"></div>
        </div>
      </section>

      <section class="view" data-view="diagnostics">
        <div class="diag">
          <div class="diag-actions">
            <button type="button" id="diag-refresh" class="btn">刷新诊断</button>
            <span id="diag-status" class="diag-status"></span>
          </div>
          <dl id="diag-list" class="diag-list"></dl>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
